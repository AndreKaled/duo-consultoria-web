<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Duo Consultoria e Negócios</title>
    <meta name="description" content="Entre em contato com a Duo Consultoria e Negócios.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
        <section class="card form-card w-100 p-4 p-md-5">
            <header class="text-center mb-4">
                <div class="company-header d-flex justify-content-center align-items-center gap-3">
                    <div class="logo rounded-circle overflow-hidden">
                        <img src="logo.png" alt="Logo Duo Consultoria">
                    </div>

                    <h1 class="company-title fs-4 fw-bold text-dark mb-0">
                        <span class="company-name">Duo</span> Consultoria e Negócios
                    </h1>
                </div>

                <p class="small fw-medium text-secondary mb-1">
                    Consultoria e soluções para o crescimento do seu negócio
                </p>

                <p class="small text-secondary mb-0">
                    Preencha os campos e ajudaremos você.
                </p>
            </header>

            <form id="formulario">
                <label for="nome" class="form-label">
                    Nome completo <span class="required">*</span>
                </label>
                <input type="text" id="nome" name="nome" class="form-control mb-4" 
                    placeholder="Digite seu nome completo" autocomplete="name" required>

                <section class="row g-3 mb-4">
                    <div class="col-sm-6">
                        <label for="cpf" class="form-label">
                            CPF <span class="required">*</span>
                        </label>
                        <input type="text" id="cpf" name="cpf" class="form-control"
                            placeholder="000.000.000-00" maxlength="14" inputmode="numeric" required>
                    </div>

                    <div class="col-sm-6">
                        <label for="cnpj" class="form-label">
                            CNPJ <span class="text-secondary fw-normal">(opcional)</span>
                        </label>
                        <input type="text" id="cnpj" name="cnpj" class="form-control" 
                            placeholder="00.000.000/0000-00" maxlength="18" inputmode="numeric">
                    </div>
                </section>

                <section class="row g-3 mb-4">
                    <div class="col-sm-6">
                        <label for="celular" class="form-label">
                            Celular / WhatsApp <span class="required">*</span>
                        </label>
                        <input type="text" id="celular" name="celular" class="form-control"
                            placeholder="(92) 99999-9999" maxlength="15" inputmode="tel"
                            autocomplete="tel" required>
                    </div>

                    <div class="col-sm-6">
                        <label for="email" class="form-label">
                            E-mail <span class="required">*</span>
                        </label>
                        <input type="email" id="email" name="email" class="form-control"
                            placeholder="seu@email.com" autocomplete="email" required>
                    </div>
                </section>

                <fieldset class="mb-4">
                    <legend class="form-label fs-6">
                        Serviços de interesse:
                    </legend>

                    <section class="row g-2">
                        <label class="col-sm-6 service-option">
                            <input
                                type="checkbox"
                                class="service-checkbox"
                                value="Consultoria"
                            >
                            <span>Consultoria Contábil, Fiscal e Financeira</span>
                        </label>

                        <label class="col-sm-6 service-option">
                            <input
                                type="checkbox"
                                class="service-checkbox"
                                value="Assessoria"
                            >
                            <span>Assessoria Contábil e Fiscal</span>
                        </label>

                        <label class="col-sm-6 service-option">
                            <input
                                type="checkbox"
                                class="service-checkbox"
                                value="Regularização"
                            >
                            <span>Abertura e Regularização de Empresas</span>
                        </label>

                        <label class="col-sm-6 service-option">
                            <input
                                type="checkbox"
                                class="service-checkbox"
                                value="Outros"
                            >
                            <span>Outras Informações</span>
                        </label>
                    </section>
                </fieldset>

                <button
                    type="submit"
                    class="btn btn-primary submit-button w-100 d-flex align-items-center justify-content-center gap-2"
                >
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                    >
                        <path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.588-5.946C.159 5.33 5.494 0 12.05 0c3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                    </svg>

                    Enviar inscrição
                </button>
            </form>

            <footer class="mt-4 text-center">
                <p class="privacy mb-0">
                    🔒 Seus dados serão utilizados exclusivamente para o seu atendimento.
                </p>

                <p class="developer mb-0">
                    Desenvolvido com ❤️ pela Duo Consultoria e Negócios
                </p>
            </footer>

        </section>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
